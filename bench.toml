# bench configuration.
#
# [defaults]
#   jobs            — parallel cells; 0 means use all CPU cores
#   timeout_seconds — per-cell timeout when a prompt's meta.json doesn't set one
#
# [[models]] — one table per benchmark target:
#   provider — as shown by `pi --list-models`
#   model    — model id (may contain ':')
#   effort   — optional pi thinking level: off | minimal | low | medium | high | xhigh;
#              omit where unapplicable, pi then uses its default.
#
# Per-run override without editing this file: run_bench.py -m 'provider/model[@effort]'

[defaults]
jobs = 0
timeout_seconds = 3600

[[models]]
provider = "openai-codex"
model = "gpt-5.5"
effort = "xhigh"

[[models]]
provider = "grok-build"
model = "grok-build"
effort = "xhigh"

[[models]]
provider = "ollama-cloud"
model = "minimax-m3"
effort = "xhigh"

[[models]]
provider = "ollama-cloud"
model = "glm-5.1"
effort = "xhigh"
