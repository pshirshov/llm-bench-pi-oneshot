<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warband — RTS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; color: #eee; }
    #app { width: 100%; height: 100%; display: flex; flex-direction: column; }
    canvas { display: block; image-rendering: pixelated; }
    #menu-screen, #level-select, #game-over-screen {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #111; z-index: 100;
    }
    #menu-screen h1 { font-size: 64px; color: #c44; margin-bottom: 40px; text-shadow: 2px 2px 4px #000; }
    .menu-btn {
      padding: 14px 40px; margin: 8px; font-size: 20px; cursor: pointer;
      background: #333; color: #eee; border: 2px solid #555; border-radius: 4px;
      min-width: 220px; text-align: center;
    }
    .menu-btn:hover { background: #444; border-color: #888; }
    .menu-btn.selected { background: #633; border-color: #c44; }
    #hud { display: none; width: 100%; height: 100%; position: relative; }
    #top-bar {
      position: absolute; top: 0; left: 0; right: 0; height: 32px;
      background: rgba(0,0,0,0.85); display: flex; align-items: center;
      padding: 0 12px; gap: 20px; z-index: 10; font-size: 14px;
    }
    #minimap-container {
      position: absolute; bottom: 0; right: 0; width: 200px; height: 200px;
      background: #111; border: 2px solid #444; z-index: 10;
    }
    #minimap-canvas { width: 100%; height: 100%; }
    #selection-panel {
      position: absolute; bottom: 0; left: 0; right: 204px; height: 160px;
      background: rgba(0,0,0,0.9); border-top: 2px solid #444; z-index: 10;
      display: flex; padding: 8px; gap: 8px; overflow-x: auto;
    }
    #build-panel {
      position: absolute; bottom: 162px; left: 0; width: 260px;
      background: rgba(0,0,0,0.9); border: 1px solid #444; z-index: 10;
      display: none; padding: 8px; gap: 4px; flex-wrap: wrap;
    }
    .panel-btn {
      padding: 6px 10px; font-size: 12px; cursor: pointer;
      background: #333; color: #eee; border: 1px solid #555; border-radius: 3px;
      min-width: 70px; text-align: center; position: relative;
    }
    .panel-btn:hover { background: #444; }
    .panel-btn.disabled { opacity: 0.4; pointer-events: none; }
    .panel-btn .cost { font-size: 10px; color: #aaa; }
    .panel-btn .progress-bar {
      position: absolute; bottom: 0; left: 0; height: 3px; background: #0a0;
    }
    .unit-portrait {
      width: 80px; height: 80px; background: #222; border: 1px solid #555;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; font-size: 11px; text-align: center; flex-shrink: 0;
    }
    .unit-portrait:hover { border-color: #aaa; }
    .hp-bar { width: 100%; height: 4px; background: #400; margin-top: 2px; }
    .hp-bar-fill { height: 100%; background: #0c0; }
    #game-over-screen h2 { font-size: 48px; margin-bottom: 20px; }
    .hidden { display: none !important; }
    #speed-indicator { color: #aaa; }
    #seed-display { color: #888; }
  </style>
</head>
<body>
  <div id="app">
    <!-- Main Menu -->
    <div id="menu-screen">
      <h1>⚔ WARBAND ⚔</h1>
      <div id="faction-select" style="margin-bottom: 20px;">
        <button class="menu-btn selected" data-faction="humans">Humans</button>
        <button class="menu-btn" data-faction="orcs">Orcs</button>
      </div>
      <button class="menu-btn" id="btn-campaign">Campaign</button>
      <button class="menu-btn" id="btn-skirmish">Skirmish</button>
      <div style="margin-top: 20px;">
        <label style="font-size: 14px; color: #888;">Seed: <input type="number" id="seed-input" value="" placeholder="random" style="width:100px; background:#222; color:#eee; border:1px solid #555; padding:4px;" /></label>
      </div>
    </div>

    <!-- Level Select -->
    <div id="level-select" class="hidden">
      <h2 style="font-size: 36px; margin-bottom: 30px;">Select Level</h2>
      <div id="level-buttons" style="display:flex; gap:12px; flex-wrap:wrap; justify-content:center;"></div>
      <button class="menu-btn" id="btn-back-menu" style="margin-top:30px;">Back</button>
    </div>

    <!-- HUD -->
    <div id="hud">
      <div id="top-bar">
        <span id="gold-display">🟡 0</span>
        <span id="wood-display">🪵 0</span>
        <span id="supply-display">👥 0/0</span>
        <span id="speed-indicator">1x</span>
        <span id="seed-display"></span>
      </div>
      <canvas id="game-canvas"></canvas>
      <canvas id="minimap-canvas" width="200" height="200" style="position:absolute;bottom:0;right:0;width:200px;height:200px;border:2px solid #444;z-index:10;"></canvas>
      <div id="selection-panel"></div>
      <div id="build-panel"></div>
    </div>

    <!-- Game Over -->
    <div id="game-over-screen" class="hidden">
      <h2 id="game-over-text"></h2>
      <button class="menu-btn" id="btn-menu">Main Menu</button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
